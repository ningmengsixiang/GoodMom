<!-- 合并说明：本页原为独立入口页，V2.7 起全部内容并入 site/index.html 的「组件与状态」模块。
     保留本文件仅为兼容旧链接（Gitea/GitHub Pages 收藏、README/CHANGELOG 引用、已发出的地址）。
     锚点会透传：例如 spec.html#ch-02 → index.html#site-spec--ch-02 -->
<script>
(function () {
  var mod = "preview-examples";
  var hash = (location.hash || "").replace(/^#/, "");
  var target = "../site/index.html" + "#" + mod;
  if (hash) {
    // 规范各章锚点在模块内带前缀；其余锚点也统一加模块前缀
    if (mod === "site-spec" && hash.indexOf("ch-") === 0) target += "--" + hash;
    else if (hash.indexOf(mod + "--") === 0) target = "../site/index.html" + "#" + hash;
    else target += "--" + hash;
  }
  location.replace(target);
})();
</script>
