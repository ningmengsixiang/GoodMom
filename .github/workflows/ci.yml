name: CI · GoodMom Design System

on:
  push:
    branches: [main]
  pull_request:

env:
  # vite@8 / @vitejs/plugin-vue@6 要求 ^20.19.0 || >=22.12.0。
  # 只写 `20` 会"碰巧"通过（浮动到最新的 20.x），故显式钉到满足条件的版本。
  NODE_VERSION: "20.19"

jobs:
  # ══════════════════════════════════════════════════════════════════════
  # 交付完整性（P0-1 / P0-2 / P0-3 / P0-6）
  #
  # 这是本仓库历史上最贵的一课：所有门禁都只在**工作树**上跑，
  # 于是"本地全绿"与"仓库里什么都没有"可以同时成立（V2.5–V2.7 长期未入库）。
  # 本 job 不需要网络，专门校验"交付物确实在版本库里"。
  # ══════════════════════════════════════════════════════════════════════
  delivery-integrity:
    name: 交付完整性（已入库 / 引用完整 / 基线存在）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 交付物必须已入库（无未提交 / 未跟踪文件）
        run: |
          # 排除两份**带生成时间戳**的自动报告：它们每次运行都会变（内容相同、仅时间不同），
          # 因此永远不可能让工作树干净；而"过期可自证"正是加时间戳的目的，不能去掉。
          # a11y-dom-report.md 由本工作流的 a11y-dom job 重新生成；audit-report.md 与
          # layout-gate-report.md 同样由各自 job 重新生成（内容相同、仅时间戳不同）。
          # 其余任何未提交/未跟踪文件都必须让这一步失败 —— 那才是 P0-1 要防的情况。
          DIRTY="$(git status --porcelain --untracked-files=all \
            -- . ':(exclude)docs/a11y-dom-report.md' ':(exclude)docs/audit-report.md' \
                 ':(exclude)docs/layout-gate-report.md')"
          if [ -n "$DIRTY" ]; then
            echo "::error::存在未提交或未跟踪的交付物，交付不完整："
            echo "$DIRTY" | head -40
            echo "（本地门禁全绿但仓库内容为空，是所有守门工具的共同盲区）"
            exit 1
          fi
          echo "OK 工作树干净（$(git ls-files | wc -l) 个已入库文件）"

      - name: ci.yml 引用的脚本必须已入库
        run: |
          missing=0
          for s in $(grep -oE "scripts/[A-Za-z0-9._-]+\.(py|mjs|cjs)" .github/workflows/ci.yml | sort -u); do
            if ! git ls-files --error-unmatch "$s" >/dev/null 2>&1; then
              echo "::error::CI 引用了未入库的脚本: $s"
              missing=1
            fi
          done
          [ "$missing" = "0" ] || exit 1
          echo "OK ci.yml 引用的脚本均已入库"

      - name: 站点保真度基线必须存在（P0-6）
        run: |
          # site-parity.mjs 是 CI 步骤，它需要的输入就不能同时被声明为"非交付内容"。
          # 缺文件必须显式失败，而不是静默跳过比对。
          n=$(git ls-files site/.baseline | wc -l)
          if [ "$n" -lt 8 ]; then
            echo "::error::site/.baseline 只有 $n 个已入库文件（应为 8），site-parity 将无从比对"
            ls -la site/.baseline 2>/dev/null || echo "目录不存在"
            exit 1
          fi
          echo "OK 站点基线已入库（$n 个）"

  # ══════════════════════════════════════════════════════════════════════
  # 规范与文档
  # ══════════════════════════════════════════════════════════════════════
  docs-links:
    name: 文档链接 / 审计 / 覆盖 / 无障碍 / 状态字典 / 版本
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验 Markdown 内链（递归全仓，含 docs/**）—— P2-1
        run: python3 scripts/check-md-links.py

      - name: 残留词扫描（旧称 / 旧定位）
        run: |
          # 旧写法以 `|| echo` 结尾 ⇒ 无论是否命中都退出 0，等于没有门禁。
          if grep -RIn --include='*.md' -E '未来 SaaS|数据安全态势大屏|Liquid Glass Enterprise Design System' . ; then
            echo "::error::发现旧称/旧定位残留（见上）"
            exit 1
          fi
          echo "OK 无旧称残留"

      - name: 全自动规范审计（链接/章节/图标/HTML/色彩/spec/镜像/导出）
        run: python3 scripts/audit.py

      - name: 覆盖度量（组件/资产）
        run: python3 scripts/coverage.py --ci

      - name: 静态可访问性走查
        run: python3 scripts/a11y.py --ci

      - name: 业务状态字典一致性（15 章 ⇄ React/Vue 映射表）
        run: python3 scripts/check-status-map.py --ci

      - name: 版本一致性（唯一版本源）—— P1-8
        run: python3 scripts/check-version.py --ci

      - name: 双库样式解析值一致性（React/应用侧 ↔ Vue）—— P1-19
        run: python3 scripts/check-style-parity.py --ci

  # ══════════════════════════════════════════════════════════════════════
  # 渲染级可访问性（P1-20 / P2-4）
  # 旧版工具丢弃 alpha、读数夸大 2–3 倍、且从不入 CI、无阈值。
  # ══════════════════════════════════════════════════════════════════════
  a11y-dom:
    name: 渲染级对比度（无头 Chrome 实测 + 阈值）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 chromium
        run: npx --yes playwright@latest install --with-deps chromium
      - name: 逐文本节点实测对比度（超过基线即失败）
        run: python3 scripts/a11y-dom.py

  # ══════════════════════════════════════════════════════════════════════
  # 封装层 / 开源包
  # ══════════════════════════════════════════════════════════════════════
  gm-ui-typecheck:
    name: 封装层 typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          # 缓存键必须指向锁文件；指向 package.json 时依赖一变缓存即失效
          cache-dependency-path: frontend-app/package-lock.json
      - run: npm ci || npm install
      - run: npm run gm:typecheck
      # 应用侧此前**不在 CI 里**：`gm:typecheck` 只检查封装层，根 typecheck 只检查三个开源包，
      # 于是 `frontend-app/src/App.tsx` 的类型错误长期存在而无人拦下
      # （V2.9 实测：接入时应用侧 tsc 有 2 处错误、封装层 typecheck 也是红的）。
      - run: npx tsc --noEmit -p tsconfig.json
      # 生产构建可用性：tsc 过不代表打得出来（别名、动态 import、CSS 引入都可能只有构建期报错）
      - run: npm run build

  component-contract:
    name: 组件库契约冒烟（React + Vue 渲染级）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci || npm install
      - run: npx --yes playwright install --with-deps chromium

      # Vue 侧此前有 37 项渲染级冒烟，但**不在 CI 里**：V2.9 实测它早已是 32/37 ——
      # 5 条语义色断言照抄了 V2.8 之前的旧值（深档化后没人同步）。
      # React 侧则一项都没有，于是"类型能过、渲染不对"的缺陷（环形直径被 Arco 的 size
      # 吃掉、actions 契约与 tags 不一致）长期存活。两侧现在都进 CI。
      - name: React 组件契约（esbuild 打包 → 断言 56 项）
        run: node goodmom-ui/playground/smoke.mjs

      - name: Vue 组件契约（vite 验收台 → 断言 37 项）
        run: |
          set -euo pipefail
          nohup npx vite --config goodmom-vue/playground/vite.config.ts >/tmp/vite-vue.log 2>&1 &
          SRV=$!
          trap 'kill $SRV 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:5273/; then break; fi
            if [ "$i" = "30" ]; then echo "::error::Vue 验收台未就绪"; cat /tmp/vite-vue.log; exit 1; fi
            sleep 1
          done
          node goodmom-vue/playground/smoke.mjs

  app-smoke:
    name: 产品工程 UI 冒烟（frontend-app · 三端形态 + 四态）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend-app/package-lock.json
      - run: npm ci || npm install
      - run: npx --yes playwright install --with-deps chromium
      # 起服务 / 跑脚本 / 关服务必须在同一个 run 块内（否则后台进程会被清掉，
      # 报错变成 ERR_CONNECTION_REFUSED，与真实原因无关 —— 站点 job 已踩过这个坑）。
      - name: 起 dev server → 跑冒烟 → 关服务
        run: |
          set -euo pipefail
          nohup npx vite --port 3081 --strictPort >/tmp/vite-app.log 2>&1 &
          SRV=$!
          trap 'kill $SRV 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:3081/; then break; fi
            if [ "$i" = "30" ]; then echo "::error::应用 dev server 未就绪"; cat /tmp/vite-app.log; exit 1; fi
            sleep 1
          done
          node ../scripts/app-smoke.mjs

  architecture-gate:
    name: 工程架构门禁（模块边界 / 分层方向 / 状态词登记 / 色值与配方）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 纯静态扫描，不需要 node_modules：读 import 图、模块 README、状态词字典、样式文件
      - run: python3 scripts/check-module-boundary.py

  open-pkg-typecheck:
    name: 开源包 typecheck + build（@goodmom/ui + @goodmom/icons + @goodmom/vue）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci || npm install
      - run: npm run typecheck
      # 旧版 CI 从不构建 @goodmom/ui，构建期才会暴露的错误全部漏网
      - run: npm run build

  # ══════════════════════════════════════════════════════════════════════
  # 站点唯一首页
  # ══════════════════════════════════════════════════════════════════════
  site-build:
    name: 站点唯一首页（新鲜度 + 构建一致性 + 锚点 + 保真度 + 冒烟）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci || npm install
      - run: npx --yes playwright install --with-deps chromium

      - name: 站点片段新鲜度（重跑生成器后必须无 diff）—— P1-9
        run: |
          # `build-site.py --check` 只证明"产物 == 片段"，
          # 从不证明"片段 == 源文件"，于是内嵌规范快照可以静默过期。
          python3 scripts/gen-spec.py
          python3 scripts/gen-manual.py
          # 产品矩阵片段由 prd/zong.md 生成（7 个页面壳与交互机制同源），
          # 与 spec/manual 同样属于"片段 == 源文件"的守门范围：
          # PRD 改了而片段没重跑，页面上的功能架构/价值/数据主责就会静默过期。
          python3 scripts/gen-products.py
          # fuyouaicansai/ 下 6 个独立产品页同样由 prd/zong.md 生成（每页 4 个视图）：
          # PRD 改了而页面没重跑，页面上的功能架构/旗舰流程/主责数据就会静默过期。
          python3 scripts/gen-product-apps.py
          if ! git diff --exit-code -- site/fragments/ fuyouaicansai/; then
            echo "::error::站点片段/独立产品页已过期（与生成器输出不一致），请提交重新生成后的产物"
            exit 1
          fi
          echo "OK 站点片段与生成器输出一致"

      - name: 产物与构建结果一致（site/index.html 是产物，禁止手改）
        run: python3 scripts/build-site.py --check

      - name: 旧页面必须为重定向
        run: python3 scripts/redirect-legacy.py --check

      - name: 锚点完整性（畸形 href / 悬空锚点）—— P0-4
        run: python3 scripts/check-anchors.py

      - name: 保真度 + 冒烟（起服务 / 跑脚本 / 关服务必须在同一个 run 块内）
        env:
          SITE_URL: http://127.0.0.1:5288/site/index.html
        run: |
          set -euo pipefail
          # GitHub Actions 每个 run: 是独立 shell，且会清理上一步派生的后台进程。
          # 旧版把服务起在"保真度"步骤、在"冒烟"步骤里用，一旦不存活就以
          # ERR_CONNECTION_REFUSED 失败，报错信息与真实原因（站点回归）毫无关系。
          nohup python3 -m http.server 5288 --bind 127.0.0.1 >/tmp/site-http.log 2>&1 &
          SRV=$!
          trap 'kill $SRV 2>/dev/null || true' EXIT
          # 就绪门控：轮询到 HTTP 200 再继续，不用 sleep 猜
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null "$SITE_URL"; then break; fi
            if [ "$i" = "30" ]; then echo "::error::静态服务未就绪"; cat /tmp/site-http.log; exit 1; fi
            sleep 1
          done
          node scripts/site-parity.mjs
          node scripts/site-smoke.mjs
          # 移动端模块是"可触摸的真机演示"（4 页 / 左滑 / 下拉刷新 / 上拉加载 / 浮层焦点管理 /
          # 暗色档）。site-smoke 对它只断言"`.tab` 存在且点了会选中"—— 交互被改坏它照样全绿，
          # 故单独一支：40 条断言全部对应用户能感知的行为与几何。
          node scripts/mobile-smoke.mjs
          # 产品矩阵是"一个模块里 7 个页面"（1 对接首页 + 6 工作台，靠 .is-on 切换），而 site-smoke / page-qa /
          # a11y-dom 都只审"模块的默认呈现状态"= p01 + 落地页 ——
          # 另外 11 页的对比度/溢出/热区/曲线渲染若无这支脚本就完全不设防。
          node scripts/products-smoke.mjs
          # fuyouaicansai/ 下 6 个独立产品页：每页 4 个视图（靠 .is-on 切换），
          # page-qa / a11y-dom 只审默认视图，另外 3 个视图与全部交互由此脚本逐条断言。
          node scripts/product-apps-smoke.mjs

      - name: 逐页规范质检（结构 / 对比度 / 焦点 / 触控 / 溢出 / Token 档位）
        # 与既有守门的分工：a11y.py 是静态断言、a11y-dom.py 只测对比度；
        # 本步是**渲染级逐页质检**（真实页 11 + 产品矩阵 7 个视图状态 × 桌面/移动/暗色三档），
        # 覆盖圆角/边框/阴影/模糊/字号/字重/热区/焦点环/横向溢出/emoji/版本，
        # 每条 finding 都带规范锚点，输出 docs/page-qa-report.md。
        # 阈值：除 P3「模块未实现暗色皮肤」外必须为 0。
        run: node scripts/page-qa.mjs --ci

      - name: 布局体检（多断点响应式 · 背景白条 · 组件错位）
        # 用户三次报「各页面背景后面留有很大的白色缝隙」「所有页面都要响应式」
        # 「模块组件格式错位、布局不好」—— 这三类此前**没有任何门禁**：
        #   · page-qa 只跑 1440/375 两档，且按组件规则分类，不看"有没有人画过这块背景"；
        #   · products-smoke / product-apps-smoke 只覆盖各自模块的默认视图；
        #   · 320 档（iPhone SE 宽度）完全没人测 —— 实测三处页面级横向溢出都落在 320/768；
        #     白条真因是独立页没重置 UA 默认 `body{margin:8px}`、`html` 又没画底色。
        # 本步自起静态服务，扫 9 个站点模块 + 6 个独立页 × 4 视图 + 打印版手册（70 次扫描 / 7 档，
        # 320~1920）：P0（页面横向溢出 / 背景白条）、P1（出框 / 块级重叠）、P2（文字被切）必须为 0。
        run: node scripts/layout-gate.mjs

  vue-pkg-build:
    name: Vue 组件库构建（@goodmom/vue）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci || npm install
      - run: npm run build:vue
      - name: 产物完整性（ESM/CJS/样式/类型声明）
        run: |
          set -e
          for f in dist/index.js dist/index.cjs dist/style.css dist/index.d.ts; do
            test -s "goodmom-vue/$f" || { echo "缺少产物: $f"; exit 1; }
            echo "OK $f  $(wc -c < "goodmom-vue/$f") bytes"
          done
          grep -q -- '--mmh-grad-action-hc' goodmom-vue/dist/style.css || {
            echo "样式产物缺少品牌 Token（base.css 未被打包）"; exit 1; }
