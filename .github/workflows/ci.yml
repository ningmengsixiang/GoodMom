name: CI · GoodMom Design System

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs-links:
    name: 文档链接检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验 Markdown 内链
        run: |
          python3 - <<'PY'
          import glob, os, re, sys
          err = []
          for f in glob.glob("*.md"):
              text = open(f, encoding="utf-8").read()
              for m in re.findall(r"\]\(([^)#]+?)(?:#[^)]*)?\)", text):
                  p = m.split("#")[0]
                  if p.endswith(".md") and not os.path.exists(p):
                      err.append((f, p))
          if err:
              print("失效链接:", *err, sep="\n")
              sys.exit(1)
          print("Markdown 链接检查通过")
          PY
      - name: 残留词扫描（旧称/版本）
        run: |
          grep -RIn --include='*.md' -E '未来 SaaS|数据安全态势大屏|Liquid Glass Enterprise Design System' . || echo "无旧称残留"
      - name: 全自动规范审计（链接/章节/图标/HTML 无 md/色彩/spec）
        run: python3 scripts/audit.py

  gm-ui-typecheck:
    name: 封装层 typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-app/package.json
      - run: npm install
      - run: npm run gm:typecheck

  open-pkg-typecheck:
    name: 开源包 typecheck（@goodmom/ui + @goodmom/icons）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
